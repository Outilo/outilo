# Installateur Windows (non signé Authenticode en V1) attaché à la Release `v0.6.0` quand on pousse ce tag,
# avec latest.json signé : les Outilo installés détectent la nouvelle version au lancement.
name: Application

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OUTILO_SIGNING_KEY: ${{ secrets.OUTILO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run app:build
      - uses: actions/upload-artifact@v4
        with:
          name: installateur
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*.exe)
          name=$(basename "$exe")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name"
          notes="Installateur Windows non signé (V1 interne) : SmartScreen demandera « Exécuter quand même »."
          node scripts/sign-installer.mjs "$exe" "$GITHUB_REF_NAME" "$url" latest.json "$notes"
          gh release create "$GITHUB_REF_NAME" "$exe" latest.json \
            --title "Outilo ${GITHUB_REF_NAME#v}" --latest --notes "$notes"
