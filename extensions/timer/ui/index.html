<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/_sdk/outilo-ui.css">
  <style>
    .clock { font-family: var(--o-font-mono); font-size: 72px; font-weight: 500; text-align: center; letter-spacing: .02em; padding: 26px 0 8px; }
    .phase { text-align: center; color: var(--o-muted); min-height: 20px; }
    .phase.work { color: var(--o-accent); }
    .phase.short, .phase.long { color: var(--o-success); }
    .controls { justify-content: center; margin-top: 14px; }
    .hidden { display: none !important; }
    .presets { justify-content: center; }
    #laps { max-height: 220px; }
    .o-input.small { width: 70px; }
  </style>
</head>
<body>
  <div class="o-header">
    <h1 data-i18n="title">Minuteur</h1>
    <p class="o-sub" data-i18n="subtitle">Compte à rebours, chronomètre et pomodoro. Continue de tourner quand vous changez d’onglet.</p>
  </div>
  <div class="o-stack">
    <div class="o-row" style="justify-content:center">
      <button class="o-chip on" data-mode="countdown" data-i18n="countdown">Compte à rebours</button>
      <button class="o-chip" data-mode="stopwatch" data-i18n="stopwatch">Chronomètre</button>
      <button class="o-chip" data-mode="pomodoro">Pomodoro</button>
    </div>
    <div class="o-panel">
      <div class="clock" id="clock">5:00</div>
      <div class="phase" id="phase"></div>
      <div class="o-row presets" data-for="countdown" id="presets"></div>
      <div class="o-row presets" data-for="countdown">
        <input class="o-input" id="duration" style="width:160px" value="5:00" data-i18n-placeholder="durationHint">
      </div>
      <div class="o-row presets hidden" data-for="pomodoro">
        <label class="o-check"><span data-i18n="work">Travail</span><input class="o-input small" id="pWork" type="number" min="1" value="25"></label>
        <label class="o-check"><span data-i18n="short">Pause</span><input class="o-input small" id="pShort" type="number" min="1" value="5"></label>
        <label class="o-check"><span data-i18n="long">Longue pause</span><input class="o-input small" id="pLong" type="number" min="1" value="15"></label>
      </div>
      <div class="o-row controls">
        <button class="o-btn o-btn--primary" id="start" data-i18n="start">Démarrer</button>
        <button class="o-btn hidden" id="lap" data-i18n="lap">Tour</button>
        <button class="o-btn" id="reset" data-i18n="reset">Réinitialiser</button>
        <label class="o-check"><input type="checkbox" id="sound" checked> <span data-i18n="sound">Son</span></label>
      </div>
    </div>
    <pre class="o-pre hidden" id="laps"></pre>
  </div>
  <script src="/_sdk/outilo-sdk.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
