<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/_sdk/outilo-ui.css">
  <style>
    #out { min-height: 200px; max-height: calc(100vh - 330px); font-family: var(--o-font-ui); font-size: 14px; word-break: normal; }
    .o-input.n { width: 90px; }
  </style>
</head>
<body>
  <div class="o-header">
    <h1 data-i18n="title">Lorem ipsum</h1>
    <p class="o-sub" data-i18n="subtitle">Texte de remplissage pour vos maquettes : paragraphes, phrases, mots ou listes.</p>
  </div>

  <div class="o-stack">
    <div class="o-panel o-stack" style="gap:14px">
      <div class="o-row" id="units">
        <button class="o-chip on" data-unit="paragraphs" data-i18n="paragraphs">Paragraphes</button>
        <button class="o-chip" data-unit="sentences" data-i18n="sentences">Phrases</button>
        <button class="o-chip" data-unit="words" data-i18n="words">Mots</button>
        <button class="o-chip" data-unit="list" data-i18n="list">Liste</button>
      </div>
      <div class="o-row">
        <label class="o-check"><span data-i18n="count">Nombre</span><input class="o-input n" id="count" type="number" min="1" max="500" value="3"></label>
        <label class="o-check"><span data-i18n="lang">Langue</span>
          <select class="o-select" id="lang"><option value="latin">Latin</option><option value="fr" data-i18n="fr">Français</option><option value="en" data-i18n="en">Anglais</option></select>
        </label>
        <label class="o-check"><span data-i18n="format">Format</span>
          <select class="o-select" id="format"><option value="text" data-i18n="text">Texte</option><option value="html">HTML</option><option value="markdown">Markdown</option></select>
        </label>
        <label class="o-check"><input type="checkbox" id="classic" checked> <span data-i18n="classic">Commencer par « Lorem ipsum… »</span></label>
        <span class="o-spacer"></span>
        <button class="o-btn" id="gen" data-i18n="generate">Générer</button>
        <button class="o-btn o-btn--primary" id="copy" data-i18n="copy">Copier</button>
      </div>
    </div>
    <pre class="o-pre" id="out"></pre>
    <p class="o-sub" id="stats" style="margin:0"></p>
  </div>

  <script src="/_sdk/outilo-sdk.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
