[extension]
id = "outilo.json"
name = { fr = "JSON", en = "JSON" }
description = { fr = "Formater, minifier, valider, trier les clés, convertir JSON ⇄ YAML", en = "Format, minify, validate, sort keys, convert JSON ⇄ YAML" }
version = "1.0.0"
api = "1"
license = "Apache-2.0"
authors = ["Équipe Outilo"]
categories = ["code", "donnees"]
icon = "icon.svg"

[ui]
entry = "ui/index.html"

[[commands]]
id = "format"
title = { fr = "JSON : formater le texte saisi", en = "JSON: format the current text" }

[[commands]]
id = "minify"
title = { fr = "JSON : minifier le texte saisi", en = "JSON: minify the current text" }

[permissions]
clipboard = true
files.save = true
storage = true
